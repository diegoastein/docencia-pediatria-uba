<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Votación EFU — Pediatría UBA</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 16px;
        background: #f8f9fa;
        color: #202124;
        min-height: 100vh;
    }
    .screen {
        max-width: 480px;
        margin: 0 auto;
    }
    h1 {
        font-size: 1.3rem;
        color: #5b21b6;
        margin: 0 0 4px 0;
    }
    .subtitle {
        color: #5f6368;
        font-size: 0.9rem;
        margin: 0 0 20px 0;
    }
    .box {
        background: white;
        border: 1px solid #dadce0;
        border-radius: 14px;
        padding: 20px;
        margin-bottom: 16px;
    }
    input[type="text"] {
        width: 100%;
        padding: 12px 14px;
        font-size: 1.1rem;
        border-radius: 10px;
        border: 2px solid #dadce0;
        margin-bottom: 12px;
        text-transform: uppercase;
    }
    button {
        width: 100%;
        padding: 14px;
        font-size: 1.05rem;
        font-weight: 700;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #7c3aed, #5b21b6);
        color: white;
        cursor: pointer;
    }
    button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }
    .badge {
        display: inline-block;
        background: #f5f3ff;
        color: #5b21b6;
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 0.8rem;
        font-weight: 700;
        margin-bottom: 10px;
    }
    .case-title {
        font-size: 1.15rem;
        font-weight: 800;
        margin: 0 0 14px 0;
    }
    .case-vignette {
        font-size: 0.98rem;
        line-height: 1.5;
        color: #3c4043;
        background: #f8f9fa;
        border-left: 4px solid #7c3aed;
        border-radius: 8px;
        padding: 12px 14px;
        margin: 0 0 16px 0;
    }
    .options-list {
        list-style: none;
        padding: 0;
        margin: 0 0 18px 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .option-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 13px 14px;
        border: 2px solid #dadce0;
        border-radius: 10px;
        cursor: pointer;
        user-select: none;
        transition: all 0.15s ease;
    }
    .option-item.selected {
        border-color: #7c3aed;
        background: #f5f3ff;
        box-shadow: 0 0 0 1px #7c3aed inset;
    }
    .option-letter {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #e8eaed;
        color: #5f6368;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        flex-shrink: 0;
    }
    .option-item.selected .option-letter {
        background: #7c3aed;
        color: white;
    }
    .option-text {
        font-size: 0.98rem;
        line-height: 1.3;
    }
    .status-msg {
        text-align: center;
        padding: 40px 20px;
        color: #5f6368;
    }
    .status-msg .big {
        font-size: 2.5rem;
        margin-bottom: 12px;
    }
    .error-msg {
        color: #c5221f;
        font-size: 0.9rem;
        margin-top: -6px;
        margin-bottom: 12px;
    }
    .footer-note {
        text-align: center;
        font-size: 0.75rem;
        color: #9aa0a6;
        margin-top: 20px;
    }
    .result-summary {
        text-align: center;
        font-weight: 800;
        font-size: 1.05rem;
        padding: 12px;
        border-radius: 10px;
        margin-bottom: 16px;
    }
    .result-summary.result-perfect { background: #e6f4ea; color: #137333; }
    .result-summary.result-close { background: #fef7e0; color: #b06000; }
    .result-summary.result-bad { background: #fdf0e5; color: #c2410c; }
    .result-summary.result-zero { background: #fce8e6; color: #c5221f; }
    .result-summary.result-missed { background: #f1f3f4; color: #5f6368; }
    .option-item.result-item { cursor: default; }
    .option-item.result-correct {
        border-color: #34a853;
        background: #e6f4ea;
    }
    .option-item.result-correct .option-letter { background: #34a853; color: white; }
    .option-item.result-wrong {
        border-color: #ea4335;
        background: #fce8e6;
    }
    .option-item.result-wrong .option-letter { background: #ea4335; color: white; }
    .result-waiting {
        text-align: center;
        color: #5f6368;
        font-size: 0.85rem;
        margin: 14px 0 0 0;
    }
    .scale-picker {
        display: flex;
        gap: 8px;
        margin-bottom: 4px;
    }
    .scale-btn {
        flex: 1;
        width: auto;
        padding: 12px 0;
        background: #e8eaed;
        color: #5f6368;
    }
    .scale-btn.selected {
        background: linear-gradient(135deg, #7c3aed, #5b21b6);
        color: white;
    }
    .qna-student-list {
        list-style: none;
        padding: 0;
        margin: 0;
    }
    .qna-student-list li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 0;
        border-bottom: 1px solid #dadce0;
        font-size: 0.92rem;
    }
    .qna-student-list li:last-child { border-bottom: none; }
    .upvote-btn {
        width: auto;
        flex-shrink: 0;
        padding: 6px 12px;
        font-size: 0.85rem;
        background: #f5f3ff;
        color: #5b21b6;
    }
    .upvote-btn.voted {
        background: #ede9fe;
        color: #7c3aed;
        opacity: 0.7;
    }
    /* -------------------------------------------------- carrera autónoma de equipos ------
       Cada equipo recorre la pista por su cuenta: la barra de cronómetro vive FUERA de #content
       (que se rehace en cada render de pregunta) para que no se destruya en cada avance. */
    #raceTimerBar {
        position: fixed;
        top: 0; left: 0; right: 0;
        z-index: 50;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        font-weight: 800;
        font-size: 1rem;
        font-variant-numeric: tabular-nums;
        background: #e8f0fe;
        color: #1967d2;
        border-bottom: 1px solid #c6dafc;
    }
    /* Imprescindible: el `display: flex` de arriba le gana al `[hidden] { display: none }` del
       navegador, así que sin esta regla la barra queda visible con hidden=true (y encima sin el
       padding-top del body, tapando el contenido). */
    #raceTimerBar[hidden] { display: none; }
    #raceTimerBar.warn { background: #fef7e0; color: #b06000; border-bottom-color: #feefc3; }
    #raceTimerBar.danger { background: #fce8e6; color: #c5221f; border-bottom-color: #fad2cf; }
    body.with-race-timer { padding-top: 58px; }

    .race-progress {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 8px;
    }
    .race-progress-team {
        font-size: 0.85rem;
        font-weight: 700;
        color: #5f6368;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .race-hint { line-height: 1.45; }
    .race-attempt-note {
        font-size: 0.8rem;
        color: #5f6368;
        margin: 0 0 10px 0;
    }
    .race-review-case { margin-bottom: 16px; }
    .race-review-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 8px;
    }
    .race-review-attempts {
        font-size: 0.8rem;
        font-weight: 700;
        color: #5f6368;
        white-space: nowrap;
    }

    @media (prefers-color-scheme: dark) {
        #raceTimerBar { background: #182a4d; color: #8ab4f8; border-bottom-color: #3c4043; }
        #raceTimerBar.warn { background: #3b2f0b; color: #fdd663; border-bottom-color: #5c4a10; }
        #raceTimerBar.danger { background: #4a1512; color: #f28b82; border-bottom-color: #6b2320; }
        .race-progress-team, .race-attempt-note, .race-review-attempts { color: #9aa0a6; }
    }

    @media (prefers-color-scheme: dark) {
        .scale-btn { background: #2b2e35; color: #e8eaed; }
        .qna-student-list li { border-color: #3c4043; }
        .upvote-btn { background: #182a4d; color: #8ab4f8; }
        .upvote-btn.voted { background: #182a4d; color: #8ab4f8; }
    }
    @media (prefers-color-scheme: dark) {
        body { background: #0a0b0d; color: #f1f3f4; }
        .box { background: #1e2025; border-color: #3c4043; }
        .subtitle { color: #9aa0a6; }
        input[type="text"] { background: #1e2025; color: #f1f3f4; border-color: #3c4043; }
        .option-item { border-color: #3c4043; }
        .option-item.selected { background: #182a4d; border-color: #8ab4f8; box-shadow: 0 0 0 1px #8ab4f8 inset; }
        .option-letter { background: #3c4043; color: #e8eaed; }
        .option-item.selected .option-letter { background: #8ab4f8; color: #0c0d0f; }
        .badge { background: #182a4d; color: #8ab4f8; }
        .case-title { color: #f1f3f4; }
        .case-vignette { background: #17181c; color: #d5d8dc; border-left-color: #8ab4f8; }
        .result-summary.result-perfect { background: #133220; color: #81c995; }
        .result-summary.result-close { background: #3d2e05; color: #fbbc04; }
        .result-summary.result-bad { background: #3a220f; color: #ffab6e; }
        .result-summary.result-zero { background: #3b1816; color: #f28b82; }
        .result-summary.result-missed { background: #2b2e35; color: #9aa0a6; }
        .option-item.result-correct { border-color: #81c995; background: #133220; }
        .option-item.result-correct .option-letter { background: #81c995; color: #0c0d0f; }
        .option-item.result-wrong { border-color: #f28b82; background: #3b1816; }
        .option-item.result-wrong .option-letter { background: #f28b82; color: #0c0d0f; }
        .result-waiting { color: #9aa0a6; }
    }
</style>
</head>
<body>
<div id="raceTimerBar" hidden></div>
<div class="screen" id="app">
    <h1>🗳️ Votación EFU</h1>
    <p class="subtitle">Hospital Ramón Carrillo</p>
    <div id="content"></div>
    <p class="footer-note" id="footerNote">Un voto por caso desde este celular. Cuando el docente revele las respuestas vas a ver acá si acertaste.</p>
</div>

<script>
    // Debe coincidir exactamente con la constante EFU_FIREBASE_DB_URL configurada en index.html.
    const EFU_FIREBASE_DB_URL = "https://pediatria-uba-efu-votos.firebaseio.com";

    const params = new URLSearchParams(window.location.search);
    let roomId = (params.get('room') || '').trim().toUpperCase();
    let roomMeta = null;
    let teamName = '';
    let currentCase = null; // { caseId, title, options: [{letter, text, correct}] }
    let selectedLetters = [];
    let pollTimer = null;
    let caseCache = {}; // caseId -> caso ya parseado (el contenido no cambia durante el taller)
    let lastSeenKey = ''; // evita re-renderizar/refetchear si no cambió nada desde el último poll
    let activityDraftScale = null; // puntaje 1-5 elegido en el Pulso de Cierre, antes de enviar
    let pollDraftChoice = null; // índice de opción elegido en la Encuesta de Opción Múltiple, antes de enviar
    let raceWrongAttempt = false; // true tras un voto equivocado en modo Equipos: se puede reintentar (ver submitVote)

    // ---------------------------------------------------------------- CARRERA AUTÓNOMA
    // Ver el bloque grande de comentarios en index.html ("CARRERA AUTÓNOMA DE EQUIPOS"). Acá está
    // el lado que realmente corrige y avanza: este celular compara contra la clave que ya venía
    // sacando de index.html para el feedback, y escribe su propio progreso en teams/{su clave}.
    const RACE_HINT_AFTER = 3;   // intentos fallidos antes de soltar la ayuda (igual en index.html)
    let raceMeta = null;         // espejo de race/meta
    let raceTeamState = null;    // { score, current, attempts } — progreso propio del equipo
    let raceRunId = null;        // startedAt de la carrera en curso: si cambia, se largó de nuevo
    let raceAdopted = false;     // ya se releyó el progreso de Firebase (recupera recarga/batería)
    let raceClockOffset = 0;     // reloj del servidor − reloj local
    let raceAttemptFeedback = null; // { hits, total, extras, attempts } del último intento fallido
    let raceJustSolved = false;  // para el cartel verde arriba de la pregunta siguiente
    let raceTickTimer = null;

    const content = document.getElementById('content');

    async function fbGet(path) {
        const res = await fetch(`${EFU_FIREBASE_DB_URL}/${path}.json`);
        if (!res.ok) throw new Error(`GET ${path} → ${res.status}`);
        return res.json();
    }

    async function fbPost(path, body) {
        const res = await fetch(`${EFU_FIREBASE_DB_URL}/${path}.json`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error(`POST ${path} → ${res.status}`);
        return res.json();
    }

    async function fbPut(path, body) {
        const res = await fetch(`${EFU_FIREBASE_DB_URL}/${path}.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error(`PUT ${path} → ${res.status}`);
        return res.json();
    }

    async function fbPatch(path, body) {
        const res = await fetch(`${EFU_FIREBASE_DB_URL}/${path}.json`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error(`PATCH ${path} → ${res.status}`);
        return res.json();
    }

    // Misma sanitización que sanitizeTeamKey() en index.html — tiene que dar la misma clave
    // para el mismo nombre de equipo en los dos archivos, porque index.html suma puntaje bajo
    // esa clave y acá sólo se registra el nombre.
    function sanitizeTeamKey(name) {
        return String(name).trim().replace(/[.#$\[\]\/]/g, '_') || 'equipo';
    }

    function hasVoted(caseId) {
        return !!localStorage.getItem(`efuVoted_${roomId}_${caseId}`);
    }

    function markVoted(caseId) {
        localStorage.setItem(`efuVoted_${roomId}_${caseId}`, '1');
    }

    // Distinto de hasVoted/markVoted: en modo Equipos un intento equivocado NO marca "votado"
    // (se puede reintentar, ver submitVote), pero sí hubo participación — esto es lo que evita
    // que renderCaseResult diga "no llegaste a votar" a un equipo que lo intentó varias veces
    // y nunca llegó a acertar antes de que se revelara.
    function hasAttempted(caseId) {
        return !!localStorage.getItem(`efuAttempted_${roomId}_${caseId}`);
    }

    function markAttempted(caseId) {
        localStorage.setItem(`efuAttempted_${roomId}_${caseId}`, '1');
    }

    function saveChoice(caseId, letters) {
        localStorage.setItem(`efuChoice_${roomId}_${caseId}`, JSON.stringify(letters));
    }

    function getSavedChoice(caseId) {
        try {
            return JSON.parse(localStorage.getItem(`efuChoice_${roomId}_${caseId}`) || '[]');
        } catch (e) {
            return [];
        }
    }

    function getSavedTeam() {
        return localStorage.getItem(`efuTeam_${roomId}`) || '';
    }

    function saveTeam(name) {
        localStorage.setItem(`efuTeam_${roomId}`, name);
        teamName = name;
    }

    // Actividades Abiertas en Vivo (Nube de Palabras / Muro de Preguntas / Pulso de Cierre):
    // mismo patrón anti-doble-envío por localStorage que ya usan hasVoted/markVoted.
    function hasSentActivity(activityKey) {
        return !!localStorage.getItem(`efuActivitySent_${roomId}_${activityKey}`);
    }

    function markActivitySent(activityKey) {
        localStorage.setItem(`efuActivitySent_${roomId}_${activityKey}`, '1');
    }

    function hasUpvoted(responseId) {
        return !!localStorage.getItem(`efuUpvoted_${roomId}_${responseId}`);
    }

    function markUpvoted(responseId) {
        localStorage.setItem(`efuUpvoted_${roomId}_${responseId}`, '1');
    }

    function getVoterId() {
        let id = localStorage.getItem('efuVoterId');
        if (!id) {
            id = `v${Date.now()}${Math.floor(Math.random() * 100000)}`;
            localStorage.setItem('efuVoterId', id);
        }
        return id;
    }

    function renderRoomPrompt(errorMsg) {
        content.innerHTML = `
            <div class="box">
                <p>Ingresá el código de sala que te mostró el docente (o escaneá el QR proyectado).</p>
                <input type="text" id="roomInput" maxlength="6" placeholder="Ej: A3F9K2">
                ${errorMsg ? `<p class="error-msg">${errorMsg}</p>` : ''}
                <button onclick="submitRoomCode()">Ingresar</button>
            </div>
        `;
    }

    window.submitRoomCode = function () {
        const input = document.getElementById('roomInput');
        const code = (input.value || '').trim().toUpperCase();
        if (!code) return;
        window.location.href = `${window.location.pathname}?room=${encodeURIComponent(code)}`;
    };

    function renderTeamPrompt() {
        content.innerHTML = `
            <div class="box">
                <p><strong>Modo Equipos activado.</strong> Elegí un nombre para tu equipo (se usa para todo el taller de hoy).</p>
                <input type="text" id="teamInput" maxlength="30" placeholder="Ej: Equipo Rojo" style="text-transform: none;">
                <button onclick="submitTeamName()">Confirmar equipo</button>
            </div>
        `;
    }

    window.submitTeamName = function () {
        const input = document.getElementById('teamInput');
        const name = (input.value || '').trim();
        if (!name) return;
        saveTeam(name);
        // Se registra en la pista de carrera de index.html con PATCH (nunca PUT): sólo toca el
        // campo "name", así que si el equipo ya tenía puntaje de un caso anterior (por ejemplo,
        // se le cerró la página y volvió a entrar) no se lo pisa. Best-effort: si falla por un
        // corte de conexión, el equipo igual puede votar — sólo no aparece en la pista hasta
        // que se recupere la conexión en un caso posterior.
        fbPatch(`efuRooms/${roomId}/teams/${sanitizeTeamKey(name)}`, { name }).catch(() => {});
        renderApp();
    };

    function renderStatus(icon, title, subtitle) {
        content.innerHTML = `
            <div class="box status-msg">
                <div class="big">${icon}</div>
                <div style="font-size: 1.1rem; font-weight: 700; color: inherit;">${title}</div>
                ${subtitle ? `<div style="margin-top: 6px;">${subtitle}</div>` : ''}
            </div>
        `;
    }

    function toggleOption(letter) {
        const idx = selectedLetters.indexOf(letter);
        if (idx >= 0) {
            selectedLetters.splice(idx, 1);
        } else {
            selectedLetters.push(letter);
        }
        renderCaseVoting();
    }

    function renderCaseVoting() {
        if (!currentCase) return;
        // En modo Equipos el proyector no muestra el enunciado (queda sólo la carrera a pantalla
        // completa) — acá es la única pantalla que lo tiene. En Anónimo el proyector lo sigue
        // mostrando como siempre, así que acá no se duplica (sigue siendo "Caso en pantalla").
        const showVignette = roomMeta && roomMeta.mode === 'equipos';
        content.innerHTML = `
            <div class="box">
                <span class="badge">${showVignette ? 'Caso EFU' : 'Caso en pantalla'}</span>
                ${showVignette ? `<div class="case-vignette">${currentCase.vignette}</div>` : ''}
                ${raceWrongAttempt ? '<div class="result-summary result-zero">❌ No es correcto — ajustá la selección y probá de nuevo</div>' : ''}
                <ul class="options-list">
                    ${currentCase.options.map(opt => `
                        <li class="option-item ${selectedLetters.includes(opt.letter) ? 'selected' : ''}" onclick="window.__toggleOpt('${opt.letter}')">
                            <span class="option-letter">${opt.letter}</span>
                            <span class="option-text">${opt.text}</span>
                        </li>
                    `).join('')}
                </ul>
                <button id="submitVoteBtn" ${selectedLetters.length === 0 ? 'disabled' : ''} onclick="submitVote()">
                    Votar (${selectedLetters.length} seleccionada${selectedLetters.length === 1 ? '' : 's'})
                </button>
            </div>
        `;
    }
    window.__toggleOpt = toggleOption;

    window.submitVote = async function () {
        if (!currentCase || selectedLetters.length === 0) return;
        const btn = document.getElementById('submitVoteBtn');
        if (btn) { btn.disabled = true; btn.innerText = 'Enviando...'; }
        // !opinionMode: en Modo Opinión no hay respuesta correcta, así que no corresponde
        // corregir localmente ni hacer reintentar — es un voto único, como en Anónimo.
        const isEquipos = roomMeta && roomMeta.mode === 'equipos' && !roomMeta.opinionMode;
        try {
            const body = { options: [...selectedLetters], ts: Date.now() };
            if (isEquipos) body.team = teamName;
            await fbPost(`efuRooms/${roomId}/votes/${currentCase.caseId}`, body);

            if (isEquipos) {
                // Corrección local e inmediata: el caso ya trae qué opciones son correctas
                // (mismo dato que compara el proyector), así que no hace falta esperar al
                // servidor ni al docente para saber si el equipo acertó. Si no acertó, NO se
                // marca votado — puede ajustar la selección y reenviar las veces que haga falta.
                markAttempted(currentCase.caseId);
                saveChoice(currentCase.caseId, selectedLetters); // el intento más reciente, gane o pierda
                const correctLetters = currentCase.options.filter(o => o.correct).map(o => o.letter);
                const isExactMatch = selectedLetters.length === correctLetters.length
                    && selectedLetters.every(l => correctLetters.includes(l));
                if (isExactMatch) {
                    markVoted(currentCase.caseId);
                    lastSeenKey = `${currentCase.caseId}_1_true`;
                    renderStatus('🎉', '¡Correcto!', 'Mirá tu auto en la pantalla. Esperando el próximo caso...');
                } else {
                    raceWrongAttempt = true;
                    renderCaseVoting();
                }
                return;
            }

            markVoted(currentCase.caseId);
            saveChoice(currentCase.caseId, selectedLetters);
            lastSeenKey = `${currentCase.caseId}_1_true`;
            renderStatus('✅', 'Voto enviado', 'Esperando a que el docente cierre la votación... Cuando revele las respuestas vas a ver acá mismo si acertaste.');
        } catch (err) {
            if (btn) { btn.disabled = false; btn.innerText = 'Reintentar envío'; }
            alert('No se pudo enviar el voto, revisá tu conexión e intentá de nuevo.');
        }
    };

    // El contenido de cada caso (título y opciones) se saca siempre de index.html — nunca se
    // inventa ni se duplica texto clínico. Se cachea por caseId porque no cambia en el taller.
    // index.html pesa cerca de 850 KB: se descarga y se parsea UNA sola vez por celular, no una
    // vez por caso. Antes daba lo mismo (un caso por taller a la vez), pero con la carrera cada
    // equipo pasa por toda la pista y eran 10 descargas completas por teléfono.
    let indexDocPromise = null;
    function getIndexDoc() {
        if (!indexDocPromise) {
            indexDocPromise = fetch('index.html')
                .then((res) => res.text())
                .then((html) => new DOMParser().parseFromString(html, 'text/html'))
                .catch((err) => { indexDocPromise = null; throw err; });
        }
        return indexDocPromise;
    }

    async function extractCaseFromIndex(caseId) {
        if (caseCache[caseId]) return caseCache[caseId];

        const doc = await getIndexDoc();
        const answerBox = doc.getElementById('ans' + caseId);
        if (!answerBox) return null;
        const card = answerBox.closest('.card');
        if (!card) return null;

        let title = card.querySelector('h2') ? card.querySelector('h2').innerText : '';
        title = title.replace(/\s*\(.*?\)\s*$/, ''); // sin spoilers, igual que en el proyector

        // Mismo innerHTML que usa index.html para armar el Modo Presentación (initPresentationData).
        // En modo Equipos el proyector ya no muestra el enunciado (queda sólo la carrera a pantalla
        // completa), así que acá es la única fuente — ver renderCaseVoting().
        const vignette = card.querySelector('.efu-vignette') ? card.querySelector('.efu-vignette').innerHTML : '';

        const options = [];
        card.querySelectorAll('.efu-options li').forEach((li, idx) => {
            let text = li.innerHTML.replace(/^<strong>[A-H]\.<\/strong>\s*/i, '');
            let correct = li.getAttribute('data-correct') === 'true';
            options.push({ letter: String.fromCharCode(65 + idx), text, correct });
        });

        const parsed = { caseId, title, vignette, options };
        caseCache[caseId] = parsed;
        return parsed;
    }

    // Feedback de acierto/error cuando el docente revela las respuestas (fase 2). Se arma sólo
    // con las letras correctas/elegidas — nunca con la justificación clínica completa, que
    // queda en el proyector. El tono es irónico/juguetón a propósito (pedido del docente), con
    // un ícono distinto por nivel de acierto.
    function buildResultSummary(myChoice, correctLetters, didVote) {
        if (!didVote) {
            return { cls: 'result-missed', icon: '⏰', text: 'No llegaste a votar este caso' };
        }

        const total = correctLetters.length;
        const hits = myChoice.filter(l => correctLetters.includes(l)).length;
        const extras = myChoice.filter(l => !correctLetters.includes(l)).length;
        const ratio = total > 0 ? hits / total : 0;

        if (hits === total && extras === 0) {
            return {
                cls: 'result-perfect',
                icon: '🎉',
                text: total === 1 ? '¡Excelente! Acertaste la opción correcta' : `¡Excelente! Acertaste las ${total} opciones`
            };
        }
        if (hits === 0) {
            return { cls: 'result-zero', icon: '🥶', text: 'No acertaste ninguna. ¿Pasó algo anoche? ¿Dormiste bien?' };
        }
        if (ratio >= 0.66) {
            return {
                cls: 'result-close',
                icon: '😅',
                text: `Bien... ${hits} sobre ${total}. Está casi bien${extras > 0 ? ' (aunque marcaste alguna de más)' : ''}...`
            };
        }
        return { cls: 'result-bad', icon: '😬', text: `Grrrhhh... ${hits} sobre ${total}, no nos fue muy bien, ¿no?` };
    }

    function renderCaseResult(parsed, myChoice, didVote) {
        const correctLetters = parsed.options.filter(o => o.correct).map(o => o.letter);
        const { cls: summaryClass, icon: summaryIcon, text: summaryText } = buildResultSummary(myChoice, correctLetters, didVote);
        const showVignette = roomMeta && roomMeta.mode === 'equipos';

        content.innerHTML = `
            <div class="box">
                <span class="badge">Respuestas reveladas</span>
                ${showVignette ? `<div class="case-vignette">${parsed.vignette}</div>` : ''}
                <div class="result-summary ${summaryClass}">${summaryIcon} ${summaryText}</div>
                <ul class="options-list">
                    ${parsed.options.map(opt => {
                        const picked = myChoice.includes(opt.letter);
                        let cls = 'result-item';
                        if (opt.correct) cls += ' result-correct';
                        else if (picked) cls += ' result-wrong';
                        return `
                            <li class="option-item ${cls}">
                                <span class="option-letter">${opt.correct ? '✓' : (picked ? '✗' : opt.letter)}</span>
                                <span class="option-text">${opt.text}</span>
                            </li>
                        `;
                    }).join('')}
                </ul>
                <p class="result-waiting">Esperando el próximo caso...</p>
            </div>
        `;
    }

    // ==========================================================================
    // CARRERA AUTÓNOMA DE EQUIPOS
    // ==========================================================================
    // Mecánica (17/09/2026): este celular es el que corrige y avanza. Si el equipo contesta mal o
    // incompleto SIGUE con la misma pregunta, conservando lo que tenía marcado; a partir del
    // tercer intento fallido aparece una ayuda que dice cuántas acertó y cuántas le faltan (nunca
    // cuáles). Apenas acierta, la pregunta siguiente aparece sola, sin que el docente toque nada.
    // El progreso se escribe en teams/{clave del equipo} — cada equipo sólo su propio nodo, así
    // que no hay condiciones de carrera — y el proyector lo lee para dibujar la pista.

    function raceTeamKey() { return sanitizeTeamKey(teamName); }

    // Mismo mecanismo que el cronómetro del examen: todos los relojes se alinean contra el reloj
    // del servidor de Firebase y no contra el del dispositivo, porque un celular con la hora
    // puesta a mano vería un tiempo restante distinto al proyectado.
    async function syncRaceClock() {
        try {
            const t0 = Date.now();
            await fbPut(`efuRooms/${roomId}/race/clockPing`, { '.sv': 'timestamp' });
            const server = await fbGet(`efuRooms/${roomId}/race/clockPing`);
            const t1 = Date.now();
            if (typeof server === 'number') raceClockOffset = server - (t0 + t1) / 2;
        } catch (err) { /* sin alineación se sigue con el reloj local */ }
    }

    function raceNow() { return Date.now() + raceClockOffset; }

    function raceFmtClock(ms) {
        if (ms < 0) ms = 0;
        const total = Math.floor(ms / 1000);
        return `${String(Math.floor(total / 60)).padStart(2, '0')}:${String(total % 60).padStart(2, '0')}`;
    }

    function escHtml(v) {
        return String(v == null ? '' : v).replace(/[&<>"']/g, (c) => (
            { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
        ));
    }

    // Log local del recorrido (intentos y última selección por caso). Sirve para la revisión del
    // final en este mismo celular: no se sube nada nuevo a Firebase por esto.
    function raceLocalKey() { return `efuRace_${roomId}_${raceTeamKey()}`; }

    function loadRaceLocal() {
        try { return JSON.parse(localStorage.getItem(raceLocalKey()) || 'null') || { log: {} }; }
        catch (e) { return { log: {} }; }
    }

    function saveRaceLocal(st) {
        try { localStorage.setItem(raceLocalKey(), JSON.stringify(st)); } catch (e) { /* sin espacio: se pierde sólo la revisión local */ }
    }

    function logRaceAttempt(caseId, letters, solved) {
        const st = loadRaceLocal();
        if (!st.log) st.log = {};
        const prev = st.log[caseId] || { attempts: 0, solved: false };
        st.log[caseId] = {
            attempts: prev.attempts + 1,
            choice: letters.slice(),
            solved: solved || prev.solved
        };
        st.runId = raceRunId;
        saveRaceLocal(st);
    }

    // ---------------------------------------------------------------- barra de cronómetro
    function updateRaceTimerBar() {
        const bar = document.getElementById('raceTimerBar');
        if (!bar) return;
        if (!raceMeta || raceMeta.status !== 'running') {
            bar.hidden = true;
            document.body.classList.remove('with-race-timer');
            return;
        }
        bar.hidden = false;
        document.body.classList.add('with-race-timer');
        const total = raceMeta.total || (raceMeta.caseIds || []).length;
        const hechos = (raceTeamState && raceTeamState.score) || 0;
        const left = raceMeta.endsAt ? Math.max(0, raceMeta.endsAt - raceNow()) : null;
        bar.className = left === null ? '' : (left < 60000 ? 'danger' : (left < 300000 ? 'warn' : ''));
        bar.innerHTML = `<span>🏁 ${hechos}/${total}</span><span>${left === null ? 'sin límite de tiempo' : '⏱ ' + raceFmtClock(left)}</span>`;
    }

    function hideRaceTimerBar() {
        const bar = document.getElementById('raceTimerBar');
        if (bar) bar.hidden = true;
        document.body.classList.remove('with-race-timer');
    }

    function setFooterNote(text) {
        const el = document.getElementById('footerNote');
        if (el) el.textContent = text;
    }

    // ---------------------------------------------------------------- ayuda del 3er intento
    // Dice CUÁNTAS acertó y cuántas le faltan, nunca cuáles. Tono coloquial y ameno, a pedido del
    // docente: la idea es desatascar al equipo sin regalarle la respuesta.
    function raceHintText(fb) {
        const faltan = fb.total - fb.hits;
        let base;
        if (fb.hits === 0) {
            base = `Por ahora no pegaron ninguna de las ${fb.total} que hay que marcar. No se enrosquen con el diagnóstico: vuelvan al examen físico y a los datos del laboratorio, la pista casi siempre está ahí.`;
        } else if (faltan === 1) {
            base = `¡Uy, están a una! Ya tienen ${fb.hits} de ${fb.total} bien marcadas: falta una sola.`;
        } else {
            base = `Van bien: tienen ${fb.hits} de ${fb.total} bien marcadas, les faltan ${faltan}.`;
        }
        if (fb.extras === 1) {
            base += ' Ojo que además hay una marcada que no va — probá sacando alguna.';
        } else if (fb.extras > 1) {
            base += ` Ojo que además hay ${fb.extras} marcadas que no van — probá sacando alguna.`;
        }
        return base;
    }

    // ---------------------------------------------------------------- pregunta en curso
    function renderRaceVoting(total) {
        if (!currentCase) return;
        const nro = (raceTeamState.current || 0) + 1;
        const fb = raceAttemptFeedback;
        const hint = fb && fb.attempts >= RACE_HINT_AFTER ? raceHintText(fb) : null;
        const solvedBanner = raceJustSolved;
        raceJustSolved = false;

        content.innerHTML = `
            <div class="box">
                <div class="race-progress">
                    <span class="badge">🏁 Pregunta ${nro} de ${total}</span>
                    <span class="race-progress-team">${escHtml(teamName)}</span>
                </div>
                ${solvedBanner ? '<div class="result-summary result-perfect">✅ ¡Correcta! Vamos con la que viene 🚗💨</div>' : ''}
                ${fb ? `<div class="result-summary result-zero">❌ Todavía no. Seguí con esta misma pregunta.</div>` : ''}
                ${hint ? `<div class="result-summary result-close race-hint">💡 ${escHtml(hint)}</div>` : ''}
                ${fb ? `<p class="race-attempt-note">Van ${fb.attempts} ${fb.attempts === 1 ? 'intento' : 'intentos'} en esta pregunta${fb.attempts < RACE_HINT_AFTER ? ` — a los ${RACE_HINT_AFTER} te damos una ayuda` : ''}.</p>` : ''}
                <div class="case-vignette">${currentCase.vignette}</div>
                <ul class="options-list">
                    ${currentCase.options.map(opt => `
                        <li class="option-item ${selectedLetters.includes(opt.letter) ? 'selected' : ''}" onclick="window.__toggleRaceOpt('${opt.letter}')">
                            <span class="option-letter">${opt.letter}</span>
                            <span class="option-text">${opt.text}</span>
                        </li>
                    `).join('')}
                </ul>
                <button id="submitVoteBtn" ${selectedLetters.length === 0 ? 'disabled' : ''} onclick="submitRaceAttempt()">
                    Responder (${selectedLetters.length} seleccionada${selectedLetters.length === 1 ? '' : 's'})
                </button>
            </div>
        `;
    }

    // Toggle propio de la carrera: el de la votación clásica llama a renderCaseVoting(), que no
    // conoce el progreso ni la ayuda y borraría los carteles de la pantalla.
    window.__toggleRaceOpt = function (letter) {
        const idx = selectedLetters.indexOf(letter);
        if (idx >= 0) selectedLetters.splice(idx, 1);
        else selectedLetters.push(letter);
        renderRaceVoting(raceMeta.total || (raceMeta.caseIds || []).length);
    };

    window.submitRaceAttempt = async function () {
        if (!currentCase || selectedLetters.length === 0 || !raceTeamState) return;
        if (raceMeta.status !== 'running') return;
        const btn = document.getElementById('submitVoteBtn');
        if (btn) { btn.disabled = true; btn.innerText = 'Enviando...'; }

        const total = raceMeta.total || (raceMeta.caseIds || []).length;
        const correctLetters = currentCase.options.filter(o => o.correct).map(o => o.letter);
        const hits = selectedLetters.filter(l => correctLetters.includes(l)).length;
        const extras = selectedLetters.filter(l => !correctLetters.includes(l)).length;
        const solved = hits === correctLetters.length && extras === 0;

        try {
            // El intento queda en el mismo nodo de votos de siempre: de ahí sale la revisión del
            // docente al final (no se agrega ningún dato nuevo a Firebase por esta mecánica).
            await fbPost(`efuRooms/${roomId}/votes/${currentCase.caseId}`, {
                options: selectedLetters.slice(), team: teamName, ts: Date.now()
            });
        } catch (err) {
            if (btn) { btn.disabled = false; btn.innerText = 'Reintentar envío'; }
            alert('No se pudo enviar la respuesta, revisá tu conexión e intentá de nuevo.');
            return;
        }

        logRaceAttempt(currentCase.caseId, selectedLetters, solved);
        saveChoice(currentCase.caseId, selectedLetters);
        markAttempted(currentCase.caseId);

        if (solved) {
            markVoted(currentCase.caseId);
            raceTeamState.score++;
            raceTeamState.current++;
            raceTeamState.attempts = 0;
            raceAttemptFeedback = null;
            raceJustSolved = true;
            selectedLetters = [];
        } else {
            raceTeamState.attempts++;
            raceAttemptFeedback = { hits, total: correctLetters.length, extras, attempts: raceTeamState.attempts };
        }

        const finished = total > 0 && raceTeamState.current >= total;
        const patch = {
            name: teamName,
            score: raceTeamState.score,
            current: raceTeamState.current,
            attempts: raceTeamState.attempts,
            lastAdvanceAt: raceNow()
        };
        if (finished) patch.finishedAt = raceNow();
        // Best-effort: si falla por un corte, el equipo igual sigue jugando con su estado local y
        // el próximo intento vuelve a mandar el progreso completo (es un PATCH idempotente).
        fbPatch(`efuRooms/${roomId}/teams/${raceTeamKey()}`, patch)
            .catch(() => {});

        if (solved) {
            // La pregunta siguiente aparece en el acto, sin esperar el próximo poll ni al docente.
            lastSeenKey = '';
            await handleRaceTick();
        } else {
            lastSeenKey = `race_${raceRunId}_${raceTeamState.current}_${raceTeamState.attempts}`;
            renderRaceVoting(total); // misma pregunta, conservando lo que tenía marcado
        }
    };

    // ---------------------------------------------------------------- revisión del final
    // Sólo con la carrera cerrada. Muestra únicamente los casos que este equipo llegó a responder,
    // con la clave y lo que marcó en su último intento.
    async function renderRaceReview() {
        const caseIds = raceMeta.caseIds || [];
        const local = loadRaceLocal();
        const hechos = (raceTeamState && raceTeamState.score) || 0;

        content.innerHTML = `
            <div class="box">
                <span class="badge">🏁 Carrera terminada</span>
                <p class="case-title">Llegaron hasta ${hechos} de ${caseIds.length}.</p>
                <p style="margin: 0; font-size: 0.9rem; opacity: 0.8;">
                    Acá abajo está la revisión de las preguntas que respondieron, con la clave y lo que marcaron.
                    Mirá la pantalla para ver cómo quedó la carrera.
                </p>
            </div>
            <div id="raceReviewList"><div class="box status-msg">Armando la revisión…</div></div>
        `;

        const parts = [];
        for (let i = 0; i < caseIds.length; i++) {
            const entry = (local.log || {})[caseIds[i]];
            if (!entry) continue; // no llegaron a esta pregunta
            const parsed = await extractCaseFromIndex(caseIds[i]);
            if (!parsed) continue;
            const choice = entry.choice || [];
            parts.push(`
                <div class="box race-review-case">
                    <div class="race-review-head">
                        <span class="badge" style="margin: 0;">Pregunta ${i + 1}</span>
                        <span class="race-review-attempts">
                            ${entry.solved ? '✅ resuelta' : '⏳ sin resolver'} · ${entry.attempts} ${entry.attempts === 1 ? 'intento' : 'intentos'}
                        </span>
                    </div>
                    <div class="case-vignette">${parsed.vignette}</div>
                    <ul class="options-list" style="margin-bottom: 0;">
                        ${parsed.options.map(opt => {
                            const picked = choice.includes(opt.letter);
                            let cls = 'result-item';
                            if (opt.correct) cls += ' result-correct';
                            else if (picked) cls += ' result-wrong';
                            return `
                                <li class="option-item ${cls}">
                                    <span class="option-letter">${opt.correct ? '✓' : (picked ? '✗' : opt.letter)}</span>
                                    <span class="option-text">${opt.text}</span>
                                </li>
                            `;
                        }).join('')}
                    </ul>
                </div>
            `);
        }

        const listEl = document.getElementById('raceReviewList');
        if (!listEl) return; // la pantalla cambió mientras se armaba
        listEl.innerHTML = parts.length
            ? parts.join('')
            : '<div class="box status-msg">No alcanzaron a responder ninguna pregunta.</div>';
    }

    // ---------------------------------------------------------------- ciclo de la carrera
    async function handleRaceTick() {
        const status = raceMeta.status || 'lobby';
        const total = raceMeta.total || (raceMeta.caseIds || []).length;
        const runId = raceMeta.startedAt || 0;

        // Se largó (o el docente largó de nuevo): se vuelve a leer el progreso de Firebase y se
        // limpia el log local, para que la revisión del final sea de ESTA carrera.
        if (runId !== raceRunId) {
            raceRunId = runId;
            raceAdopted = false;
            raceAttemptFeedback = null;
            if (status === 'running') saveRaceLocal({ runId, log: {} });
        }

        if (status === 'lobby') {
            raceTeamState = null;
            hideRaceTimerBar();
            setFooterNote('Cada equipo corre por su cuenta desde su celular.');
            if (lastSeenKey !== 'race_lobby') {
                lastSeenKey = 'race_lobby';
                currentCase = null;
                renderStatus('🏁', `Anotados como "${teamName}"`,
                    'Esperando la largada. En cuanto el docente largue la carrera te aparece la primera pregunta acá mismo.');
            }
            return;
        }

        if (status === 'closed') {
            hideRaceTimerBar();
            setFooterNote('Carrera terminada.');
            if (lastSeenKey !== 'race_closed') {
                lastSeenKey = 'race_closed';
                currentCase = null;
                if (!raceTeamState) {
                    try {
                        const mine = await fbGet(`efuRooms/${roomId}/teams/${raceTeamKey()}`) || {};
                        raceTeamState = { score: mine.score || 0, current: mine.current || 0, attempts: mine.attempts || 0 };
                    } catch (e) { raceTeamState = { score: 0, current: 0, attempts: 0 }; }
                }
                await renderRaceReview();
            }
            return;
        }

        // ------------------------------------------------------------------ status === 'running'
        // Primer tick de la carrera en este celular: el progreso sale de Firebase y no del
        // localStorage, porque el proyector tiene que coincidir con lo que ve el equipo (y así una
        // recarga, un cambio de celular o quedarse sin batería no pierde el lugar).
        if (!raceAdopted) {
            raceAdopted = true;
            try {
                const mine = await fbGet(`efuRooms/${roomId}/teams/${raceTeamKey()}`) || {};
                raceTeamState = { score: mine.score || 0, current: mine.current || 0, attempts: mine.attempts || 0 };
            } catch (err) {
                raceTeamState = raceTeamState || { score: 0, current: 0, attempts: 0 };
            }
            await syncRaceClock();
        }
        if (!raceTeamState) raceTeamState = { score: 0, current: 0, attempts: 0 };

        setFooterNote('Si te equivocás seguís con la misma pregunta hasta resolverla. Cuando acertás, pasa sola a la siguiente.');
        updateRaceTimerBar();

        // Autoentrega por tiempo: el docente también cierra la carrera desde index.html, pero esto
        // es la red de seguridad si se le cerró la pestaña (mismo criterio que el examen).
        if (raceMeta.endsAt && raceNow() >= raceMeta.endsAt) {
            hideRaceTimerBar();
            if (lastSeenKey !== 'race_timeup') {
                lastSeenKey = 'race_timeup';
                currentCase = null;
                renderStatus('⏰', '¡Se terminó el tiempo!',
                    `Llegaron hasta ${raceTeamState.score} de ${total}. Mirá la pantalla para ver cómo quedó la carrera.`);
            }
            return;
        }

        if (total > 0 && raceTeamState.current >= total) {
            if (lastSeenKey !== 'race_done') {
                lastSeenKey = 'race_done';
                currentCase = null;
                renderStatus('🏁', '¡Completaron toda la pista!',
                    'Resolvieron las ' + total + ' preguntas. Mirá la pantalla — falta ver si llegaron primeros.');
            }
            return;
        }

        const caseId = (raceMeta.caseIds || [])[raceTeamState.current];
        if (!caseId) {
            if (lastSeenKey !== 'race_nopista') {
                lastSeenKey = 'race_nopista';
                renderStatus('⏳', 'Preparando la pista...', 'El docente todavía no cargó las preguntas de la carrera.');
            }
            return;
        }

        const key = `race_${raceRunId}_${raceTeamState.current}_${raceTeamState.attempts}`;
        if (key === lastSeenKey) return; // nada cambió: no re-renderizar (borraría lo marcado)
        lastSeenKey = key;

        const parsed = await extractCaseFromIndex(caseId);
        if (!parsed) {
            renderStatus('⚠️', 'No se pudo cargar la pregunta', 'Reintentando...');
            currentCase = null;
            lastSeenKey = '';
            return;
        }
        currentCase = parsed;
        selectedLetters = [];
        raceWrongAttempt = false;
        renderRaceVoting(total);
    }

    // ==========================================================================
    // ACTIVIDADES ABIERTAS EN VIVO (Nube de Palabras / Muro de Preguntas / Pulso / Encuesta)
    // ==========================================================================
    // Se renderizan en vez de la votación de casos cuando roomMeta.activity existe. No
    // duplican ningún dato: usan la misma sala/QR y los mismos helpers fbGet/fbPost/fbPut.

    function renderActivityForm(activity) {
        if (activity.type === 'wordcloud') {
            content.innerHTML = `
                <div class="box">
                    <span class="badge">☁️ Nube de Palabras</span>
                    <p class="case-title">${activity.prompt}</p>
                    <input type="text" id="activityTextInput" maxlength="40" placeholder="Una palabra o frase corta" style="text-transform: none;">
                    <button onclick="submitActivityResponse()">Enviar</button>
                </div>
            `;
        } else if (activity.type === 'pulse') {
            activityDraftScale = null;
            content.innerHTML = `
                <div class="box">
                    <span class="badge">🌡️ Pulso de Cierre</span>
                    <p class="case-title">${activity.prompt}</p>
                    <div class="scale-picker" id="scalePicker">
                        ${[1, 2, 3, 4, 5].map(n => `<button type="button" class="scale-btn" data-n="${n}" onclick="window.__pickScale(${n})">${n}</button>`).join('')}
                    </div>
                    <input type="text" id="activityTextInput" placeholder="(Opcional) ¿Qué pedís reforzar?" style="text-transform: none; margin-top: 10px;">
                    <button onclick="submitActivityResponse()">Enviar</button>
                </div>
            `;
        } else if (activity.type === 'poll') {
            pollDraftChoice = null;
            content.innerHTML = `
                <div class="box">
                    <span class="badge">🗳️ Encuesta</span>
                    <p class="case-title">${activity.prompt}</p>
                    <ul class="options-list" id="pollOptionsList">
                        ${activity.options.map((opt, idx) => `
                            <li class="option-item" onclick="window.__pickPollOption(${idx})">
                                <span class="option-letter">${String.fromCharCode(65 + idx)}</span>
                                <span class="option-text">${opt}</span>
                            </li>
                        `).join('')}
                    </ul>
                    <button id="submitPollBtn" disabled onclick="submitActivityResponse()">Votar</button>
                </div>
            `;
        }
    }

    window.__pickScale = function (n) {
        activityDraftScale = n;
        document.querySelectorAll('.scale-btn').forEach(b => b.classList.toggle('selected', Number(b.dataset.n) === n));
    };

    window.__pickPollOption = function (idx) {
        pollDraftChoice = idx;
        document.querySelectorAll('#pollOptionsList .option-item').forEach((li, i) => li.classList.toggle('selected', i === idx));
        const btn = document.getElementById('submitPollBtn');
        if (btn) btn.disabled = false;
    };

    window.submitActivityResponse = async function () {
        const activity = roomMeta.activity;
        const textInput = document.getElementById('activityTextInput');
        const text = textInput ? textInput.value.trim() : '';
        if (activity.type === 'wordcloud' && !text) {
            alert('Escribí algo antes de enviar.');
            return;
        }
        if (activity.type === 'pulse' && !activityDraftScale) {
            alert('Elegí un puntaje del 1 al 5.');
            return;
        }
        if (activity.type === 'poll' && pollDraftChoice === null) {
            alert('Elegí una opción.');
            return;
        }
        const body = { ts: Date.now() };
        if (text) body.text = text;
        if (activity.type === 'pulse') body.scale = activityDraftScale;
        if (activity.type === 'poll') body.choice = pollDraftChoice;
        try {
            await fbPost(`efuRooms/${roomId}/activity/${activity.key}/responses`, body);
            markActivitySent(activity.key);
            lastSeenKey = ''; // fuerza re-render en el próximo poll para mostrar "ya enviaste"
            renderStatus('✅', 'Respuesta enviada', 'Gracias por participar.');
        } catch (err) {
            alert('No se pudo enviar, probá de nuevo.');
        }
    };

    function renderQnaShell(activity) {
        content.innerHTML = `
            <div class="box">
                <span class="badge">❓ Muro de Preguntas</span>
                <p class="case-title">${activity.prompt}</p>
                ${activity.status === 'open' ? `
                    <input type="text" id="qnaTextInput" maxlength="140" placeholder="Escribí tu pregunta" style="text-transform: none;">
                    <button onclick="submitQnaQuestion()">Enviar pregunta</button>
                ` : '<p style="opacity: 0.7;">Ya no se aceptan preguntas nuevas.</p>'}
            </div>
            <div class="box">
                <p style="margin: 0 0 8px 0; font-weight: 700; font-size: 0.9rem;">Preguntas de la clase</p>
                <ul class="qna-student-list" id="qnaStudentList"><li style="opacity: 0.6;">Cargando...</li></ul>
            </div>
        `;
    }

    window.submitQnaQuestion = async function () {
        const activity = roomMeta.activity;
        const input = document.getElementById('qnaTextInput');
        const text = input ? input.value.trim() : '';
        if (!text) return;
        try {
            await fbPost(`efuRooms/${roomId}/activity/${activity.key}/responses`, { text, ts: Date.now() });
            if (input) input.value = ''; // sin bloqueo: se pueden mandar varias preguntas
        } catch (err) {
            alert('No se pudo enviar la pregunta, probá de nuevo.');
        }
    };

    window.upvoteQuestion = async function (responseId) {
        if (hasUpvoted(responseId)) return;
        const activity = roomMeta.activity;
        try {
            await fbPut(`efuRooms/${roomId}/activity/${activity.key}/upvotes/${responseId}/${getVoterId()}`, true);
            markUpvoted(responseId);
            refreshQnaList(activity);
        } catch (err) {
            // se puede reintentar tocando de nuevo
        }
    };

    async function refreshQnaList(activity) {
        const listEl = document.getElementById('qnaStudentList');
        if (!listEl) return;
        try {
            const responses = await fbGet(`efuRooms/${roomId}/activity/${activity.key}/responses`) || {};
            const upvotes = await fbGet(`efuRooms/${roomId}/activity/${activity.key}/upvotes`) || {};
            const list = Object.entries(responses)
                .map(([id, r]) => ({ id, text: r.text, count: Object.keys(upvotes[id] || {}).length }))
                .sort((a, b) => b.count - a.count);
            if (list.length === 0) {
                listEl.innerHTML = '<li style="opacity: 0.6;">Todavía no hay preguntas.</li>';
                return;
            }
            listEl.innerHTML = list.map((q) => {
                const voted = hasUpvoted(q.id);
                return `
                    <li>
                        <span>${q.text}</span>
                        <button class="upvote-btn ${voted ? 'voted' : ''}" ${voted ? 'disabled' : ''} onclick="upvoteQuestion('${q.id}')">▲ ${q.count}</button>
                    </li>
                `;
            }).join('');
        } catch (err) {
            // silencioso: se reintenta en el próximo poll de 2s
        }
    }

    function renderActivityShell(activity) {
        if (activity.status === 'closed' && activity.type !== 'qna') {
            renderStatus('⏹️', 'Esta actividad ya cerró', 'Gracias por participar.');
            return;
        }
        if (activity.type === 'wordcloud' || activity.type === 'pulse' || activity.type === 'poll') {
            if (hasSentActivity(activity.key)) {
                renderStatus('✅', 'Ya enviaste tu respuesta', 'Gracias por participar.');
                return;
            }
            renderActivityForm(activity);
            return;
        }
        if (activity.type === 'qna') {
            renderQnaShell(activity);
        }
    }

    async function checkForNewCase() {
        try {
            roomMeta = await fbGet(`efuRooms/${roomId}/meta`);
        } catch (err) {
            return; // sin conexión momentánea: se reintenta en el próximo poll
        }
        if (!roomMeta) {
            renderStatus('⏳', 'Sala no encontrada', 'Puede que el docente todavía no haya activado la votación.');
            lastSeenKey = '';
            return;
        }

        if (roomMeta.mode === 'equipos' && !getSavedTeam()) {
            if (lastSeenKey !== 'teamPrompt') {
                lastSeenKey = 'teamPrompt';
                renderTeamPrompt();
            }
            return;
        }
        if (roomMeta.mode === 'equipos') teamName = getSavedTeam();

        // Actividad Abierta en Vivo activa: reemplaza a la votación de casos hasta que el
        // docente la cierre (meta.activity vuelve a null) — mismo QR/sala, sin fetch extra.
        const activity = roomMeta.activity;
        if (activity && activity.type) {
            const shellKey = `activity_${activity.type}_${activity.status}_${activity.key}`;
            if (shellKey !== lastSeenKey) {
                lastSeenKey = shellKey;
                renderActivityShell(activity);
            }
            if (activity.type === 'qna' && activity.status === 'open') {
                refreshQnaList(activity); // se actualiza cada poll, sin pisar el input de la pregunta
            }
            currentCase = null;
            return;
        }

        // Carrera autónoma de equipos: tiene prioridad sobre el flujo de caso único conducido por
        // el docente, pero NO sobre las Actividades Abiertas (chequeadas arriba) ni sobre el Modo
        // Opinión, que sigue siendo un caso proyectado con la distribución del grupo en pantalla.
        // Si race/meta no existe, es una sala vieja en modo Equipos y sigue el flujo de siempre.
        if (roomMeta.mode === 'equipos' && !roomMeta.opinionMode) {
            let rm = null;
            try {
                rm = await fbGet(`efuRooms/${roomId}/race/meta`);
            } catch (err) {
                return; // sin conexión momentánea: se reintenta en el próximo poll
            }
            if (rm && rm.status) {
                raceMeta = rm;
                await handleRaceTick();
                return;
            }
        }
        hideRaceTimerBar();

        const caseId = roomMeta.currentCaseId;
        if (!caseId) {
            renderStatus('⏳', 'Esperando el primer caso...', 'El docente todavía no inició la votación de ningún caso.');
            currentCase = null;
            lastSeenKey = '';
            return;
        }

        const voted = hasVoted(caseId);
        const key = `${caseId}_${roomMeta.phase}_${voted}`;
        if (key === lastSeenKey) return; // nada cambió desde el último poll: no volver a renderizar/refetchear
        lastSeenKey = key;

        if (roomMeta.phase === 2) {
            // El docente reveló las respuestas: mostrar si acertaste o no (nunca antes de esto).
            currentCase = null;
            if (roomMeta.opinionMode) {
                // Modo Opinión: no hay respuesta "correcta" — la distribución del grupo se ve
                // en el proyector, acá sólo agradecemos la participación.
                renderStatus('🗣️', 'Gracias por participar', 'Mirá la distribución del grupo en pantalla — este caso era una encuesta de opinión, sin respuesta correcta.');
                return;
            }
            const parsed = await extractCaseFromIndex(caseId);
            if (!parsed) {
                renderStatus('⚠️', 'No se pudieron cargar las respuestas', 'Reintentando...');
                lastSeenKey = '';
                return;
            }
            // "Participó" para el resumen: en Anónimo es lo mismo que "votó" (un solo intento);
            // en Equipos, un intento equivocado no marca `voted` (se podía reintentar) pero sí
            // cuenta como participación — si no, un equipo que lo intentó varias veces y nunca
            // llegó a acertar vería "no llegaste a votar este caso", que sería falso.
            renderCaseResult(parsed, getSavedChoice(caseId), voted || hasAttempted(caseId));
            return;
        }

        // Fase de votación (phase 1)
        if (voted) {
            renderStatus('✅', 'Voto enviado', 'Esperando a que el docente cierre la votación...');
            currentCase = null;
            return;
        }

        const parsed = await extractCaseFromIndex(caseId);
        if (!parsed) {
            renderStatus('⚠️', 'No se pudo cargar el caso', 'Reintentando...');
            currentCase = null;
            lastSeenKey = '';
            return;
        }
        currentCase = parsed;
        selectedLetters = [];
        raceWrongAttempt = false;
        renderCaseVoting();
    }

    function renderApp() {
        if (!roomId) {
            renderRoomPrompt();
            return;
        }
        renderStatus('⏳', 'Conectando con la sala...', '');
        if (pollTimer) clearInterval(pollTimer);
        checkForNewCase();
        pollTimer = setInterval(checkForNewCase, 2000);
        // El cronómetro de la carrera se refresca cada segundo aparte del polling de 2s: la barra
        // vive fuera de #content, así que actualizarla no interfiere con la pregunta en pantalla.
        if (raceTickTimer) clearInterval(raceTickTimer);
        raceTickTimer = setInterval(() => {
            if (raceMeta && raceMeta.status === 'running') updateRaceTimerBar();
        }, 1000);
    }

    if (!EFU_FIREBASE_DB_URL) {
        renderStatus('⚠️', 'Votación en vivo no disponible', 'Consultá con el docente.');
    } else {
        renderApp();
    }
</script>
</body>
</html>
