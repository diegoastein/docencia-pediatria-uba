<!DOCTYPE html>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background: #f8f9fa; color: #202124; }
        h1 { color: #1a73e8; border-bottom: 2px solid #1a73e8; padding-bottom: 10px; }

        .copied { background: #1e8e3e !important; }
    </style>
</head>
<body>

    <script>
        function copiar(id, btn) {
            var copyText = document.getElementById(id);
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value);
            btn.innerText = "¡Copiado!";
            btn.classList.add("copied");
            setTimeout(function(){
                btn.innerText = "Copiar Texto";
                btn.classList.remove("copied");
            }, 2000);
        }
    </script>
