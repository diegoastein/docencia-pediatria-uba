<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pantalla del examen — Pediatría UBA</title>
<!-- QRCode CDN: mismo que usa index.html para el QR de la sala -->
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
    /* ======================================================================
       PANTALLA PARA PROYECTAR DURANTE EL EXAMEN
       ----------------------------------------------------------------------
       Página de SÓLO LECTURA: mira la sala en Firebase y muestra el tiempo
       restante. No escribe nada (salvo el ping de reloj), así que proyectarla
       no puede alterar el examen por un clic accidental.

       Nunca muestra contenido del examen: ni enunciados, ni opciones, ni
       respuestas. Sólo título, tiempo y cuántos entregaron — se puede dejar
       proyectada toda la hora sin filtrar nada.
       ====================================================================== */
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #eaf4f2;
        background: #0b1f26;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: default;
    }
    body.idle { cursor: none; }

    /* --- Fondo relajante: manchas de color muy suaves, a la deriva --------
       Verde azulado profundo, sin saturación alta ni contrastes duros: es una
       pantalla que queda proyectada 90 minutos frente a alumnos rindiendo. --- */
    .bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        background:
            radial-gradient(circle at 50% 50%, #123943 0%, #0b1f26 55%, #071419 100%);
        overflow: hidden;
    }
    .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
        opacity: 0.5;
    }
    .blob.b1 { width: 55vw; height: 55vw; background: #14b8a6; top: -12vw; left: -10vw; animation: drift1 42s ease-in-out infinite alternate; }
    .blob.b2 { width: 48vw; height: 48vw; background: #0e7490; bottom: -14vw; right: -8vw; animation: drift2 55s ease-in-out infinite alternate; }
    .blob.b3 { width: 38vw; height: 38vw; background: #2c7a7b; top: 35%; left: 55%; opacity: 0.35; animation: drift3 63s ease-in-out infinite alternate; }

    @keyframes drift1 { from { transform: translate(0, 0) scale(1); } to { transform: translate(9vw, 7vh) scale(1.12); } }
    @keyframes drift2 { from { transform: translate(0, 0) scale(1.08); } to { transform: translate(-8vw, -6vh) scale(1); } }
    @keyframes drift3 { from { transform: translate(0, 0); } to { transform: translate(-11vw, 8vh); } }

    /* Fase de alerta: el fondo vira a ámbar y después a rojo, muy de a poco. */
    body.warn .blob.b1 { background: #d97706; }
    body.warn .blob.b2 { background: #b45309; }
    body.warn .blob.b3 { background: #f59e0b; }
    body.warn .bg { background: radial-gradient(circle at 50% 50%, #3d2a10 0%, #241a0c 55%, #150f06 100%); }

    body.danger .blob.b1 { background: #dc2626; }
    body.danger .blob.b2 { background: #991b1b; }
    body.danger .blob.b3 { background: #ef4444; }
    body.danger .bg { background: radial-gradient(circle at 50% 50%, #401616 0%, #260d0d 55%, #170707 100%); }

    .bg, .blob { transition: background 3s linear; }

    @media (prefers-reduced-motion: reduce) {
        .blob { animation: none; }
    }

    /* --- Contenido -------------------------------------------------------- */
    .stage {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 1400px;
        padding: 4vh 5vw;
        text-align: center;
    }

    .titulo {
        font-size: clamp(1.1rem, 2.6vw, 2.2rem);
        font-weight: 700;
        letter-spacing: 0.01em;
        margin: 0 0 6px 0;
        text-wrap: balance;
    }
    .subtitulo {
        font-size: clamp(0.8rem, 1.3vw, 1.1rem);
        opacity: 0.6;
        margin: 0 0 4vh 0;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
    }

    .fase {
        display: inline-block;
        font-size: clamp(0.75rem, 1.2vw, 1rem);
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        padding: 7px 20px;
        border-radius: 999px;
        background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.18);
        margin-bottom: 3vh;
    }

    .reloj {
        font-size: clamp(5rem, 22vw, 20rem);
        font-weight: 200;
        line-height: 0.95;
        font-variant-numeric: tabular-nums;
        font-feature-settings: "tnum";
        letter-spacing: -0.02em;
        margin: 0;
        text-shadow: 0 6px 60px rgba(0,0,0,0.35);
    }
    .reloj-label {
        font-size: clamp(0.75rem, 1.2vw, 1rem);
        letter-spacing: 0.22em;
        text-transform: uppercase;
        opacity: 0.55;
        margin-top: 1.5vh;
    }
    body.danger .reloj { animation: latido 1s ease-in-out infinite; }
    @keyframes latido { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
    @media (prefers-reduced-motion: reduce) { body.danger .reloj { animation: none; } }

    /* Barra de tiempo transcurrido */
    .barra {
        height: 8px;
        width: min(70vw, 900px);
        margin: 4vh auto 0 auto;
        border-radius: 99px;
        background: rgba(255,255,255,0.14);
        overflow: hidden;
    }
    .barra > i {
        display: block;
        height: 100%;
        width: 0%;
        border-radius: 99px;
        background: rgba(255,255,255,0.75);
        transition: width 1s linear;
    }

    .chips {
        display: flex;
        gap: 14px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 4vh;
    }
    .chip {
        background: rgba(255,255,255,0.09);
        border: 1px solid rgba(255,255,255,0.14);
        border-radius: 14px;
        padding: 12px 22px;
        min-width: 130px;
    }
    .chip b {
        display: block;
        font-size: clamp(1.4rem, 3vw, 2.4rem);
        font-weight: 700;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
    }
    .chip span {
        font-size: clamp(0.65rem, 0.95vw, 0.85rem);
        opacity: 0.6;
        letter-spacing: 0.1em;
        text-transform: uppercase;
    }

    /* --- Lobby: QR grande para que escaneen --- */
    .lobby-grid {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(24px, 5vw, 70px);
        flex-wrap: wrap;
    }
    .qr-card {
        background: white;
        padding: 18px;
        border-radius: 20px;
        line-height: 0;
        box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }
    .qr-card img, .qr-card canvas { display: block; width: 100% !important; height: auto !important; }
    .lobby-side { text-align: left; }
    .codigo {
        font-size: clamp(2.6rem, 8vw, 6rem);
        font-weight: 700;
        letter-spacing: 0.14em;
        font-variant-numeric: tabular-nums;
        margin: 6px 0 10px 0;
    }
    .codigo-label, .lobby-hint {
        font-size: clamp(0.7rem, 1.1vw, 1rem);
        opacity: 0.6;
        letter-spacing: 0.14em;
        text-transform: uppercase;
    }
    .lobby-hint { text-transform: none; letter-spacing: 0; margin-top: 14px; max-width: 34ch; line-height: 1.6; }

    /* --- Pantallas de estado / código --- */
    .msg-icono { font-size: clamp(3rem, 9vw, 7rem); margin-bottom: 2vh; }
    .msg-texto { font-size: clamp(1rem, 2vw, 1.7rem); opacity: 0.75; line-height: 1.6; }

    .form-codigo { margin-top: 3vh; }
    .form-codigo input {
        font-size: clamp(1.4rem, 4vw, 3rem);
        padding: 12px 22px;
        border-radius: 14px;
        border: 2px solid rgba(255,255,255,0.25);
        background: rgba(255,255,255,0.08);
        color: inherit;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        width: min(90vw, 460px);
        font-family: inherit;
    }
    .form-codigo button {
        display: block;
        margin: 16px auto 0 auto;
        font-size: 1.1rem;
        font-weight: 700;
        padding: 12px 34px;
        border-radius: 12px;
        border: none;
        background: #14b8a6;
        color: #06241f;
        cursor: pointer;
        font-family: inherit;
    }

    /* --- Controles del docente (se esconden solos) --- */
    .controles {
        position: fixed;
        z-index: 3;
        bottom: 18px;
        right: 18px;
        display: flex;
        gap: 8px;
        opacity: 0;
        transition: opacity 0.35s ease;
    }
    body:not(.idle) .controles { opacity: 1; }
    .controles button {
        background: rgba(255,255,255,0.12);
        border: 1px solid rgba(255,255,255,0.2);
        color: inherit;
        font-size: 0.82rem;
        font-weight: 600;
        padding: 8px 14px;
        border-radius: 10px;
        cursor: pointer;
        font-family: inherit;
        backdrop-filter: blur(6px);
    }
    .controles button:hover { background: rgba(255,255,255,0.2); }

    .conexion {
        position: fixed;
        z-index: 3;
        bottom: 20px;
        left: 20px;
        font-size: 0.78rem;
        opacity: 0;
        transition: opacity 0.35s ease;
    }
    body:not(.idle) .conexion { opacity: 0.5; }
    .conexion.caida { opacity: 1 !important; color: #fca5a5; font-weight: 700; }
</style>
</head>
<body>
<div class="bg">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
</div>

<div class="stage" id="stage"></div>

<div class="conexion" id="conexion"></div>
<div class="controles">
    <button onclick="toggleFullscreen()" id="btnFs">⛶ Pantalla completa</button>
    <button onclick="location.reload()">🔄 Recargar</button>
</div>

<script>
    // Debe coincidir con EFU_FIREBASE_DB_URL de index.html / examen.html.
    const EFU_FIREBASE_DB_URL = "https://pediatria-uba-efu-votos.firebaseio.com";

    const UMBRAL_WARN = 5 * 60 * 1000;   // últimos 5 minutos: fondo ámbar
    const UMBRAL_DANGER = 60 * 1000;     // último minuto: fondo rojo y latido

    const params = new URLSearchParams(window.location.search);
    let roomId = (params.get('room') || '').trim().toUpperCase();

    let meta = null;
    let students = {};
    let clockOffset = 0;     // hora del servidor − hora de esta máquina
    let ultimoOk = 0;        // timestamp del último poll exitoso
    let vistaActual = '';    // para no re-renderizar el DOM en cada tick
    let qrPintadoPara = '';

    const stage = document.getElementById('stage');

    function ahora() { return Date.now() + clockOffset; }

    // ----------------------------------------------------------------- Firebase (REST)
    async function fbGet(path) {
        const res = await fetch(`${EFU_FIREBASE_DB_URL}/${path}.json`);
        if (!res.ok) throw new Error('GET ' + path);
        return res.json();
    }

    // Sincronización con el reloj del servidor: sin esto, una máquina con la hora corrida
    // mostraría un tiempo restante distinto al de los celulares de los alumnos.
    async function syncClock() {
        try {
            const t0 = Date.now();
            await fetch(`${EFU_FIREBASE_DB_URL}/efuRooms/${roomId}/exam/clockPing.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ '.sv': 'timestamp' })
            });
            const server = await fbGet(`efuRooms/${roomId}/exam/clockPing`);
            const t1 = Date.now();
            if (typeof server === 'number') clockOffset = server - (t0 + t1) / 2;
        } catch (e) { /* si falla, se usa el reloj local */ }
    }

    // ----------------------------------------------------------------- utilidades
    function escapeHtml(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
            { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
        ));
    }

    function fmt(ms) {
        if (ms < 0) ms = 0;
        const total = Math.floor(ms / 1000);
        const h = Math.floor(total / 3600);
        const m = Math.floor((total % 3600) / 60);
        const s = total % 60;
        const dd = (n) => String(n).padStart(2, '0');
        return h > 0 ? `${h}:${dd(m)}:${dd(s)}` : `${dd(m)}:${dd(s)}`;
    }

    function contarAlumnos() {
        const lista = Object.values(students || {});
        return {
            total: lista.length,
            entregados: lista.filter(s => s && s.status === 'submitted').length
        };
    }

    // ----------------------------------------------------------------- render
    // renderVista() arma el DOM sólo cuando cambia la fase; tick() actualiza los números
    // cada 250 ms sin tocar el resto (si no, el QR se volvería a dibujar todo el tiempo).
    function renderVista() {
        const fase = !roomId ? 'codigo'
            : (!meta ? 'inexistente' : (meta.status || 'lobby'));

        if (fase === vistaActual) return;
        vistaActual = fase;

        if (fase === 'codigo') return renderPedirCodigo();
        if (fase === 'inexistente') return renderMensaje('🔍', 'No hay ningún examen con el código <strong>' + escapeHtml(roomId) + '</strong>.', true);
        if (fase === 'lobby') return renderLobby();
        if (fase === 'closed') return renderCerrado();
        return renderEnCurso();
    }

    function renderPedirCodigo() {
        document.body.classList.remove('warn', 'danger');
        stage.innerHTML = `
            <div class="msg-icono">🖥️</div>
            <h1 class="titulo">Pantalla del aula</h1>
            <p class="msg-texto">Escribí el código del examen que está tomando.</p>
            <div class="form-codigo">
                <input type="text" id="codeInput" maxlength="6" autocomplete="off" placeholder="XXXXXX">
                <button onclick="entrarConCodigo()">Mostrar</button>
            </div>
        `;
        const input = document.getElementById('codeInput');
        if (input) { input.focus(); input.addEventListener('keydown', e => { if (e.key === 'Enter') entrarConCodigo(); }); }
    }

    window.entrarConCodigo = function () {
        const v = (document.getElementById('codeInput').value || '').trim().toUpperCase();
        if (!v) return;
        roomId = v;
        vistaActual = '';
        const u = new URL(window.location.href);
        u.searchParams.set('room', roomId);
        history.replaceState(null, '', u.toString());
        poll();
    };

    function renderMensaje(icono, html, conFormulario) {
        document.body.classList.remove('warn', 'danger');
        stage.innerHTML = `
            <div class="msg-icono">${icono}</div>
            <p class="msg-texto">${html}</p>
            ${conFormulario ? `
                <div class="form-codigo">
                    <input type="text" id="codeInput" maxlength="6" autocomplete="off" placeholder="XXXXXX">
                    <button onclick="entrarConCodigo()">Probar otro código</button>
                </div>` : ''}
        `;
        const input = document.getElementById('codeInput');
        if (input) input.addEventListener('keydown', e => { if (e.key === 'Enter') entrarConCodigo(); });
    }

    function renderLobby() {
        document.body.classList.remove('warn', 'danger');
        const url = `${window.location.origin}${window.location.pathname.replace(/pantalla_examen\.html$/, '')}examen.html?room=${roomId}`;
        const dur = Number(meta.durationMin) || 0;

        stage.innerHTML = `
            <h1 class="titulo">${escapeHtml(meta.titulo || 'Examen')}</h1>
            <p class="subtitulo">${meta.tipo === 'prefinal' ? 'Prefinal' : 'Parcial'} · ${meta.nQuestions || '?'} preguntas${dur ? ' · ' + dur + ' minutos' : ''}</p>
            <div class="lobby-grid">
                <div class="qr-card" id="qrBox" style="width: min(38vh, 340px);"></div>
                <div class="lobby-side">
                    <div class="codigo-label">Código del examen</div>
                    <div class="codigo">${escapeHtml(roomId)}</div>
                    <div class="chip" style="display:inline-block; min-width:0;">
                        <b id="nConectados">0</b>
                        <span>anotados</span>
                    </div>
                    <p class="lobby-hint">Escaneá el QR con la cámara del celular. Si no funciona,
                    entrá a <strong>examen.html</strong> y escribí el código a mano.</p>
                </div>
            </div>
        `;
        pintarQr(url);
    }

    function pintarQr(url) {
        const box = document.getElementById('qrBox');
        if (!box || typeof QRCode === 'undefined') return;
        if (qrPintadoPara === url && box.childElementCount) return;
        box.innerHTML = '';
        const lado = Math.round(box.getBoundingClientRect().width) || 300;
        new QRCode(box, { text: url, width: lado, height: lado, correctLevel: QRCode.CorrectLevel.M });
        qrPintadoPara = url;
    }

    function renderEnCurso() {
        const sinLimite = !meta.endsAt;
        stage.innerHTML = `
            <h1 class="titulo">${escapeHtml(meta.titulo || 'Examen')}</h1>
            <p class="subtitulo">${meta.tipo === 'prefinal' ? 'Prefinal' : 'Parcial'} · ${meta.nQuestions || '?'} preguntas</p>
            <div class="fase" id="faseChip">Examen en curso</div>
            <div class="reloj" id="reloj">${sinLimite ? '∞' : '--:--'}</div>
            <div class="reloj-label" id="relojLabel">${sinLimite ? 'Sin límite de tiempo' : 'Tiempo restante'}</div>
            ${sinLimite ? '' : `<div class="barra"><i id="barraFill"></i></div>`}
            <div class="chips">
                <div class="chip"><b id="nConectados">0</b><span>rindiendo</span></div>
                <div class="chip"><b id="nEntregados">0</b><span>entregados</span></div>
            </div>
        `;
    }

    function renderCerrado() {
        document.body.classList.remove('warn', 'danger');
        const c = contarAlumnos();
        stage.innerHTML = `
            <div class="msg-icono">✅</div>
            <h1 class="titulo">${escapeHtml(meta.titulo || 'Examen')}</h1>
            <p class="subtitulo">Examen finalizado</p>
            <p class="msg-texto">Se registraron todas las respuestas.<br>Ya pueden dejar el celular.</p>
            <div class="chips">
                <div class="chip"><b>${c.total}</b><span>rindieron</span></div>
                <div class="chip"><b>${c.entregados}</b><span>entregaron</span></div>
            </div>
        `;
    }

    // Se ejecuta 4 veces por segundo y sólo escribe números: no reconstruye el DOM.
    function tick() {
        const c = contarAlumnos();
        const elCon = document.getElementById('nConectados');
        const elEnt = document.getElementById('nEntregados');
        if (elCon) elCon.textContent = meta && meta.status === 'running' ? (c.total - c.entregados) : c.total;
        if (elEnt) elEnt.textContent = c.entregados;

        const reloj = document.getElementById('reloj');
        if (!reloj || !meta || meta.status !== 'running' || !meta.endsAt) {
            if (meta && meta.status !== 'running') document.body.classList.remove('warn', 'danger');
            return;
        }

        const restante = meta.endsAt - ahora();
        reloj.textContent = fmt(restante);

        document.body.classList.toggle('warn', restante <= UMBRAL_WARN && restante > UMBRAL_DANGER);
        document.body.classList.toggle('danger', restante <= UMBRAL_DANGER);

        const label = document.getElementById('relojLabel');
        const chip = document.getElementById('faseChip');
        if (restante <= 0) {
            if (label) label.textContent = 'Se acabó el tiempo';
            if (chip) chip.textContent = 'Tiempo cumplido';
        }

        const fill = document.getElementById('barraFill');
        if (fill && meta.startedAt) {
            const total = meta.endsAt - meta.startedAt;
            const pasado = Math.min(100, Math.max(0, ((ahora() - meta.startedAt) / total) * 100));
            fill.style.width = pasado.toFixed(2) + '%';
        }
    }

    // ----------------------------------------------------------------- ciclo
    async function poll() {
        if (!roomId) { renderVista(); return; }
        try {
            const [m, st] = await Promise.all([
                fbGet(`efuRooms/${roomId}/exam/meta`),
                fbGet(`efuRooms/${roomId}/exam/students`)
            ]);
            meta = m;
            students = st || {};
            ultimoOk = Date.now();
        } catch (err) { /* se avisa abajo si la caída se sostiene */ }

        renderVista();
        tick();
        pintarConexion();
    }

    function pintarConexion() {
        const el = document.getElementById('conexion');
        if (!el) return;
        const caida = ultimoOk && (Date.now() - ultimoOk > 20000);
        el.classList.toggle('caida', !!caida);
        el.textContent = caida
            ? '📡 Sin conexión con el servidor — el reloj sigue corriendo'
            : `Sala ${roomId || '—'}`;
    }

    // ----------------------------------------------------------------- pantalla completa
    window.toggleFullscreen = function () {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
        else document.exitFullscreen().catch(() => {});
    };

    document.addEventListener('fullscreenchange', () => {
        const b = document.getElementById('btnFs');
        if (b) b.textContent = document.fullscreenElement ? '⛶ Salir de pantalla completa' : '⛶ Pantalla completa';
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'f' || e.key === 'F') toggleFullscreen();
    });

    // El cursor y los controles se esconden solos: es una pantalla que queda proyectada.
    let idleTimer = null;
    function despertar() {
        document.body.classList.remove('idle');
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => document.body.classList.add('idle'), 4000);
    }
    ['mousemove', 'mousedown', 'keydown', 'touchstart'].forEach(ev =>
        document.addEventListener(ev, despertar, { passive: true }));
    despertar();

    // ----------------------------------------------------------------- arranque
    (async function boot() {
        if (roomId) await syncClock();
        await poll();
        setInterval(poll, 5000);
        setInterval(tick, 250);
        setInterval(() => { if (roomId) syncClock(); }, 5 * 60 * 1000);
        window.addEventListener('resize', () => { qrPintadoPara = ''; vistaActual = ''; renderVista(); });
    })();
</script>
</body>
</html>
