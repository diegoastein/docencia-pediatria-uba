<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RCP Básica Pediátrica — Taller</title>
<style>
    /* ======================================================================
       DIAPOSITIVAS PARA PROYECTOR — Taller de RCP Básica Pediátrica
       ----------------------------------------------------------------------
       Autocontenido (sin CDN), mismo criterio que el resto de los talleres
       del repo. Tema oscuro de alto contraste pensado para leerse desde el
       fondo de un aula con proyector, con tipografía fluida (clamp) en vez
       de tamaños fijos. Navegación por teclado: ← → / Espacio, Inicio/Fin,
       F para pantalla completa. Sin dependencias externas: funciona offline.
       ====================================================================== */
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: radial-gradient(circle at 50% 20%, #0f2a30 0%, #081a1f 55%, #050f12 100%);
        color: #eaf4f2;
        overflow: hidden;
    }

    .deck { position: fixed; inset: 0; display: flex; flex-direction: column; }

    /* ---------- Barra superior ---------- */
    .topbar {
        display: flex; align-items: center; justify-content: space-between;
        padding: 14px 26px 8px; flex-shrink: 0;
    }
    .topbar .kicker {
        font-size: clamp(.7rem, 1vw, .85rem); font-weight: 800; letter-spacing: .08em;
        text-transform: uppercase; color: #5eead4; opacity: .9;
    }
    .topbar .controls { display: flex; gap: 8px; align-items: center; }
    .ctrl-btn {
        background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14);
        color: #eaf4f2; border-radius: 8px; padding: 7px 13px; font-size: .82rem;
        cursor: pointer; font-weight: 600;
    }
    .ctrl-btn:hover { background: rgba(255,255,255,.12); }
    .counter { font-size: .82rem; color: #9fd8ce; font-variant-numeric: tabular-nums; margin-left: 4px; }

    /* ---------- Contenido de la diapositiva ---------- */
    .stage {
        flex: 1; display: flex; align-items: center; justify-content: center;
        padding: 0 7vw 2vh; min-height: 0;
    }
    .slide { width: 100%; max-width: 1180px; max-height: 100%; overflow: hidden; }

    .slide .kicker-tag {
        display: inline-block; font-size: clamp(.75rem, 1.1vw, .95rem); font-weight: 800;
        letter-spacing: .07em; text-transform: uppercase; color: #5eead4;
        background: rgba(94,234,212,.1); border: 1px solid rgba(94,234,212,.3);
        padding: 4px 13px; border-radius: 20px; margin-bottom: 1.1rem;
    }
    .slide h1 {
        font-size: clamp(1.7rem, 3.6vw, 3rem); line-height: 1.18; margin: 0 0 .7rem;
        font-weight: 800; color: #fff;
    }
    .slide .lead {
        font-size: clamp(1.05rem, 1.7vw, 1.4rem); color: #b7e4db; margin: 0 0 1.3rem;
        line-height: 1.4; font-weight: 500;
    }
    .slide p { font-size: clamp(1rem, 1.5vw, 1.3rem); line-height: 1.5; margin: 0 0 .9rem; color: #dfeeeb; }
    .slide ul, .slide ol { margin: 0 0 .9rem; padding-left: 1.4em; }
    .slide li { font-size: clamp(1rem, 1.5vw, 1.3rem); line-height: 1.48; margin-bottom: .55rem; color: #dfeeeb; }
    .slide li::marker { color: #5eead4; }
    .slide strong { color: #fff; }
    .slide em { color: #93e5ff; font-style: normal; font-weight: 700; }

    .portada { text-align: center; }
    .portada .emoji { font-size: clamp(2.6rem, 6vw, 4.5rem); margin-bottom: .4rem; display: block; }
    .portada h1 { font-size: clamp(2rem, 4.6vw, 3.6rem); }
    .portada .lead { font-size: clamp(1.05rem, 1.9vw, 1.5rem); max-width: 760px; margin-left: auto; margin-right: auto; }
    .portada .meta { margin-top: 1.6rem; font-size: clamp(.85rem, 1.2vw, 1rem); color: #8fb8b0; }

    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 1.6rem; margin-top: .4rem; }
    @media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
    .card {
        background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.12);
        border-radius: 14px; padding: 1.1rem 1.3rem;
    }
    .card.accent { border-color: rgba(94,234,212,.45); background: rgba(94,234,212,.06); }
    .card h3 {
        margin: 0 0 .6rem; font-size: clamp(1rem, 1.5vw, 1.25rem); color: #5eead4; font-weight: 800;
    }
    .card p, .card li { font-size: clamp(.92rem, 1.3vw, 1.12rem); }

    .steps { display: flex; flex-direction: column; gap: .8rem; margin-top: .3rem; }
    .step { display: flex; gap: .9rem; align-items: flex-start; }
    .step .n {
        flex-shrink: 0; width: clamp(28px,3vw,36px); height: clamp(28px,3vw,36px); border-radius: 50%;
        background: linear-gradient(135deg, #14b8a6, #0f766e); color: #fff; font-weight: 800;
        display: flex; align-items: center; justify-content: center; font-size: clamp(.85rem,1.3vw,1.05rem);
    }
    .step .txt strong { display: block; font-size: clamp(1rem, 1.5vw, 1.25rem); color: #fff; margin-bottom: .1rem; }
    .step .txt span { font-size: clamp(.92rem, 1.3vw, 1.1rem); color: #cfe9e3; }

    .warn, .tip, .note {
        border-radius: 12px; padding: .85rem 1.1rem; margin: 1rem 0 0; font-size: clamp(.92rem, 1.3vw, 1.12rem);
    }
    .warn { background: rgba(245,158,11,.1); border: 1px solid rgba(245,158,11,.4); color: #fde8c2; }
    .tip { background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.4); color: #cdf5da; }
    .note { background: rgba(148,163,184,.1); border: 1px solid rgba(148,163,184,.35); color: #dbe6f0; }
    .warn b, .tip b, .note b { color: #fff; }

    .bignum { display: flex; gap: 1.6rem; flex-wrap: wrap; margin: 1rem 0; }
    .bignum .item { text-align: center; }
    .bignum .item .v { font-size: clamp(1.8rem, 4vw, 3rem); font-weight: 800; color: #5eead4; line-height: 1; }
    .bignum .item .l { font-size: clamp(.8rem, 1.1vw, .95rem); color: #b7e4db; margin-top: .25rem; }

    table.cmp { width: 100%; border-collapse: collapse; margin-top: .6rem; }
    table.cmp th, table.cmp td {
        text-align: left; padding: .6rem .8rem; font-size: clamp(.9rem, 1.3vw, 1.1rem);
        border-bottom: 1px solid rgba(255,255,255,.12);
    }
    table.cmp th { color: #5eead4; font-size: clamp(.78rem, 1.05vw, .92rem); text-transform: uppercase; letter-spacing: .04em; }
    table.cmp td:first-child { color: #9fd8ce; font-weight: 700; white-space: nowrap; }

    .cierre { text-align: center; }
    .cierre .emoji { font-size: clamp(2.2rem, 5vw, 3.6rem); }

    /* ---------- Barra inferior de progreso ---------- */
    .progress-track { height: 5px; background: rgba(255,255,255,.08); flex-shrink: 0; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #14b8a6, #5eead4); transition: width .25s ease; }

    .nav-hint {
        position: fixed; bottom: 14px; right: 22px; font-size: .74rem; color: #6f9790;
        letter-spacing: .02em; pointer-events: none;
    }

    @media (max-width: 680px) {
        .stage { padding: 0 5vw 2vh; }
        .topbar { padding: 10px 14px 6px; }
    }
</style>
</head>
<body>

<div class="deck">
    <div class="topbar">
        <span class="kicker">Taller de RCP Básica Pediátrica — Cátedra de Pediatría UBA</span>

            <button class="ctrl-btn" onclick="toggleFullscreen()">⛶ Pantalla completa</button>
        </div>
    </div>
    <div class="stage"><div class="slide" id="slide"></div></div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
</div>
<div class="nav-hint">← → / espacio para avanzar · F pantalla completa</div>

{ kicker: 'Compresiones', title: 'Técnica con un solo reanimador: dos dedos', html: `

{ kicker: 'Compresiones', title: 'Técnica con dos reanimadores: pulgares que rodean el tórax', html: `

{ kicker: 'Calidad', title: 'Lo que hace que una compresión sea "de alta calidad"', html: `

let current = 0;

function renderSlide() {
    const s = SLIDES[current];
    const el = document.getElementById('slide');
    const extraClass = s.layout ? ' ' + s.layout : '';
    let header = '';
    if (s.kicker) header = `<span class="kicker-tag">${s.kicker}</span><h1>${s.title}</h1>`;
    el.className = 'slide' + extraClass;
    el.innerHTML = header + s.html;
    document.getElementById('counter').textContent = (current + 1) + ' / ' + SLIDES.length;
    document.getElementById('progressFill').style.width = ((current + 1) / SLIDES.length * 100) + '%';
}

function goTo(n) {
    if (n < 0 || n >= SLIDES.length) return;
    current = n;
    renderSlide();
}

function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
    } else {
        document.exitFullscreen().catch(() => {});
    }
}

document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); goTo(current + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); goTo(current - 1); }
    else if (e.key === 'Home') { e.preventDefault(); goTo(0); }
    else if (e.key === 'End') { e.preventDefault(); goTo(SLIDES.length - 1); }
    else if (e.key.toLowerCase() === 'f') { e.preventDefault(); toggleFullscreen(); }
});

renderSlide();
</script>
